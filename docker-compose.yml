# Day 2 streaming: Redpanda broker + Console + API service.
#
# Usage (Windows PowerShell, Docker Desktop running):
#   docker compose up -d        # start all three services
#   docker compose down         # stop everything
#
# Notes:
# - Stop the standalone broker from the Day 2 on-ramp first if it is running
#   (`docker stop redpanda-1`), since both want host port 9092.
# - Run `python scripts/train_baseline.py` once before `compose up`: the model
#   artifact is gitignored, so the API image needs it present locally.
# - Console (topic browser) at http://localhost:8080, API at http://localhost:8000.

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"

  api:
    build: .
    depends_on:
      - redpanda
    ports:
      - "8000:8000"
